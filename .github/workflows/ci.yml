name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: harness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The TypeScript task track needs a real Node toolchain; without it those tests
      # would skip and the matrix would be quietly weaker than it looks.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov=agentbench --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  benchmark:
    name: benchmark controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Cheap and needs no test execution, so it runs first and fails fast.
      - name: Lint task specifications
        run: agentbench lint

      - name: Validate every task
        run: agentbench validate --out reports/validation

      # The two assertions that make a published resolve rate mean anything.
      # noop resolving a task would prove that task is pre-solved; reference failing
      # one would prove its own reference solution does not satisfy its spec.
      - name: Negative control - the do-nothing solver must resolve nothing
        run: agentbench grade --solver noop --expect-resolve-rate 0.0 --out reports/noop

      - name: Positive control - the reference solver must resolve everything
        run: agentbench grade --solver reference --expect-resolve-rate 1.0 --out reports/reference

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: harness
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: agentbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A real benchmark pass inside the image, so a broken entrypoint or a missing
      # task file fails here rather than for whoever clones the repository next.
      - name: Run the controls inside the image
        run: |
          docker run --rm agentbench:ci list
          docker run --rm agentbench:ci lint
          docker run --rm agentbench:ci grade --solver noop --expect-resolve-rate 0.0
          docker run --rm agentbench:ci grade --solver reference --expect-resolve-rate 1.0
