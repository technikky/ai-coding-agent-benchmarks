[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-coding-agent-benchmarks"
version = "0.1.0"
description = "A validated benchmark harness for evaluating AI coding agents on real repository tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nur Afzan Zulaikha" }]
keywords = [
  "benchmark",
  "coding-agent",
  "llm-evaluation",
  "swe-bench",
  "pytest",
  "vitest",
  "task-design",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agentbench = "agentbench.cli:main"

[project.urls]
Homepage = "https://github.com/technikky/ai-coding-agent-benchmarks"
Issues = "https://github.com/technikky/ai-coding-agent-benchmarks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbench"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "node: needs Node.js and npm (the TypeScript task track)",
  "slow: runs a full task validation or grading pass",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Task workspaces and solutions contain deliberate defects and deliberately duplicated
# files. They are benchmark data, not source code, and must not be reformatted.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src/agentbench"]
strict = true
warn_unreachable = true
